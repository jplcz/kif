<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="t d">
  <title id="t">kif</title>
  <desc id="d">A ring around an upward triangle, containing a "k" whose arms end in two interface sockets.</desc>
  <!-- Original artwork, loosely inspired by the ring-and-triangle emblem style of a cult sign. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cf0c9"/>
      <stop offset="1" stop-color="#1b9e8a"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="48" fill="#0e1b24"/>
  <circle cx="128" cy="128" r="98" fill="none" stroke="url(#g)" stroke-width="10"/>
  <circle cx="128" cy="128" r="84" fill="none" stroke="#7cf0c9" stroke-opacity=".25" stroke-width="2" stroke-dasharray="3 7"/>
  <polygon points="128,50 200,172 56,172" fill="none" stroke="url(#g)" stroke-width="10" stroke-linejoin="round"/>
  <!-- the "k": a stem and two arms; each arm ends in a socket, like a method slot of an interface -->
  <path d="M104 98 V158" stroke="#e8fff8" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M104 132 L150 100 M104 132 L150 164" stroke="#e8fff8" stroke-width="10" stroke-linecap="round" fill="none"/>
  <circle cx="156" cy="95" r="8" fill="#0e1b24" stroke="#7cf0c9" stroke-width="5"/>
  <circle cx="156" cy="169" r="8" fill="#0e1b24" stroke="#7cf0c9" stroke-width="5"/>
</svg>
